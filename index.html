<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOI Stats</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <span>KOI</span>
            <small>STATS</small>
        </div>

        <nav>
            <button class="nav-btn active" data-page="overview">
                Übersicht
            </button>

            <button class="nav-btn" data-page="matches">
                Spiele
            </button>

            <button class="nav-btn" data-page="match-editor">
                Match hinzufügen
            </button>
        </nav>

    </aside>


    <!-- MAIN -->
    <main class="main">


        <!-- =========================
             ÜBERSICHT
        ========================== -->

        <section id="overview-page" class="page active">

            <div class="page-header">

                <div>
                    <h1>Übersicht</h1>
                    <p>Deine KOI Statistiken</p>
                </div>

            </div>


            <div class="stats-grid">

                <div class="stat-card">
                    <span>Matches</span>
                    <strong id="total-matches">0</strong>
                </div>

                <div class="stat-card">
                    <span>Games</span>
                    <strong id="total-games">0</strong>
                </div>

                <div class="stat-card">
                    <span>Siege</span>
                    <strong id="total-wins">0</strong>
                </div>

                <div class="stat-card">
                    <span>Niederlagen</span>
                    <strong id="total-losses">0</strong>
                </div>

                <div class="stat-card">
                    <span>Winrate</span>
                    <strong id="winrate">0%</strong>
                </div>

            </div>


            <div class="section-card">

                <div class="section-heading">
                    <h2>Letzte Matches</h2>

                    <button class="text-btn" id="overview-all-matches">
                        Alle anzeigen →
                    </button>
                </div>

                <div id="recent-matches"></div>

            </div>


            <div class="section-card">

                <h2>Gegner</h2>

                <div id="opponent-stats"></div>

            </div>

        </section>



        <!-- =========================
             MATCHES
        ========================== -->

        <section id="matches-page" class="page">

            <div class="page-header">

                <div>
                    <h1>Spiele</h1>
                    <p>Scrims und Prime League Matches</p>
                </div>

                <button class="primary-btn" id="new-match-btn">
                    + Match hinzufügen
                </button>

            </div>


            <div class="section-card">

                <div id="matches-list"></div>

            </div>

        </section>



        <!-- =========================
             MATCH EDITOR
        ========================== -->

        <section id="match-editor-page" class="page">

            <div class="page-header">

                <div>

                    <button class="back-btn" id="editor-back">
                        ← Zurück
                    </button>

                    <h1 id="editor-title">
                        Match hinzufügen
                    </h1>

                    <p id="editor-subtitle">
                        Erstelle einen neuen Scrim- oder Prime-League-Eintrag
                    </p>

                </div>

            </div>


            <!-- MATCH INFO -->

            <div class="section-card">

                <h2>Matchinformationen</h2>


                                <div class="form-grid">

                    <div class="form-group">

                        <label for="match-date">
                            Datum
                        </label>

                        <input
                            type="date"
                            id="match-date"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="match-opponent">
                            Gegner
                        </label>

                        <input
                            type="text"
                            id="match-opponent"
                            placeholder="z. B. Cloud9"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="match-type">
                            Art
                        </label>

                        <select id="match-type">

                            <option value="scrim">
                                Scrim
                            </option>

                            <option value="prime">
                                Prime League
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="match-mode">
                            Modus
                        </label>

                        <select id="match-mode">

                            <option value="bo3">
                                BO3
                            </option>

                            <option value="bo5">
                                BO5
                            </option>

                            <option value="fearless3">
                                3 Games Fearless
                            </option>

                            <option value="fearless5">
                                5 Games Fearless
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="match-drafter-link">
                            Drafter Link
                        </label>

                        <input
                            type="url"
                            id="match-drafter-link"
                            placeholder="https://..."
                            autocomplete="off"
                        >

                    </div>

                </div>

            </div>



            <!-- GAME SELECTOR -->

            <div class="section-card">

                <div class="section-heading">

                    <h2>Games</h2>

                    <span class="muted" id="game-count-text">
                        0 Games
                    </span>

                </div>


                <div
                    class="game-tabs"
                    id="editor-game-tabs"
                ></div>

            </div>



            <!-- GAME EDITOR -->

            <div id="game-editor"></div>


            <div class="form-actions">

                <button
                    type="button"
                    class="secondary-btn"
                    id="cancel-editor"
                >
                    Abbrechen
                </button>

                <button
                    type="button"
                    class="primary-btn"
                    id="save-match"
                >
                    Match speichern
                </button>

            </div>

        </section>



        <!-- =========================
             MATCH DETAIL
        ========================== -->

        <section id="match-detail-page" class="page">

            <div class="page-header">

                <div>

                    <button
                        class="back-btn"
                        id="detail-back"
                    >
                        ← Zurück zu den Spielen
                    </button>

                    <h1 id="detail-title">
                        KOI vs Gegner
                    </h1>

                    <p id="detail-subtitle"></p>

                </div>

                <div
                    id="detail-match-type"
                    class="match-type-badge"
                ></div>

            </div>


            <!-- GAME TABS -->

            <div class="section-card">

                <div
                    class="game-tabs detail-tabs"
                    id="detail-game-tabs"
                ></div>

            </div>


            <!-- CURRENT GAME -->

            <div id="detail-game"></div>

        </section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data/champions.js"></script>
<script src="app.js"></script>

</body>
</html>
